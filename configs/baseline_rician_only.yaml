seed: 0
device: cuda
experiment:
  name: baseline_rician_only_cifar10
  out_dir: runs/baseline_rician_only_cifar10
wandb:
  enabled: true
  project: dg-djscc
  entity: null
  mode: online
  tags:
  - baseline
  - djscc_wit
  - single_source
  - rician
  - cifar10
  log_images_every_epochs: 10
  num_image_samples: 8
data:
  root: null
  batch_size: 128
  num_workers: 2
  augment: true
model:
  name: baseline
  cr: 0.1667
channels:
- name: awgn
- name: rayleigh
  per_symbol: false
- name: rician
  per_symbol: false
  k_factor_db: 4.0
algorithm:
  name: djscc_wit
  mode: single_source
  train_channel: rician
train:
  epochs: 200
  lr: 0.0001
  weight_decay: 0.0
  optimizer: adam
  snr_strategy: uniform
  snr_db_fixed: 10.0
  snr_db_range:
  - 0.0
  - 20.0
  log_every: 50
  ckpt_every_epochs: 10
eval:
  snr_db_grid:
  - 0
  - 5
  - 10
  - 15
  - 20
  cross_channel: true
